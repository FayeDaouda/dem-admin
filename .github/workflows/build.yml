# Build de production à chaque push et à chaque pull request : une erreur
# d'import ou de syntaxe est détectée avant que Vercel ne tente de déployer.
# (Le lint n'est pas encore bloquant : des erreurs existantes restent à corriger.)
name: Build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
